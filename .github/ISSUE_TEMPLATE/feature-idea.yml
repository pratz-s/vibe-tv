name: Feature idea
description: Something that would make your TV get your vibe better
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
      description: Describe the moment in your evening where it would help.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
